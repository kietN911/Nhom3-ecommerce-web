<script>
fetch("https://your-backend.onrender.com/api/register", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        name: name.value,
        email: email.value,
        password: password.value
    })
})
.then(res => res.json())
.then(data => {
    if (data.status === "success") {
        alert("Đăng ký thành công");
    } else {
        alert(data.message);
    }
});
</script>
