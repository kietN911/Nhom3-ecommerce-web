<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - WEB GIÀY</title>
    <!-- CSS của Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (Biểu tượng) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font chữ từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- CSS tùy chỉnh -->
    <link rel="stylesheet" href="css/modern.css">
</head>

<body class="bg-light">

    <!-- Thanh điều hướng (Navbar) -->
    <nav class="navbar navbar-expand-lg sticky-top bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand logo-text" href="index.html">Nhóm 3</a>
            <div class="ms-auto d-flex align-items-center">
                <a href="index.html" class="btn btn-link text-decoration-none text-dark fw-bold me-3">
                    <i class="fas fa-arrow-left me-2"></i>Tiếp tục mua sắm
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4">Giỏ hàng của bạn</h4>
                        <div id="cart-container">
                            <!-- Items will be loaded here -->
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Đang tải...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Tổng đơn hàng</h5>
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Tạm tính</span>
                            <span class="fw-bold" id="subtotal">0₫</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="text-muted">Phí vận chuyển</span>
                            <span class="text-success fw-bold">Miễn phí</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fs-5 fw-bold">Tổng cộng</span>
                            <span class="fs-5 fw-bold text-primary" id="total">0₫</span>
                        </div>
                        <button class="btn btn-primary w-100 btn-lg rounded-pill shadow-sm" id="btn-checkout" onclick="placeOrder()">
                            ĐẶT HÀNG NGAY
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <div class="modal-body text-center p-5">
                    <div class="mb-4">
                        <i class="fas fa-check-circle text-success" style="font-size: 5rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-3">ĐẶT HÀNG THÀNH CÔNG!</h3>
                    <p class="text-muted mb-4">Cảm ơn bạn đã tin tưởng và chọn WEB GIÀY. Đơn hàng của bạn đang được xử lý.</p>
                    <p class="small text-primary mb-0">Tự động quay về trang chủ sau <span id="countdown">3</span> giây...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script của Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8001/api';

        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });

        async function loadCart() {
            try {
                const response = await fetch(`${API_BASE_URL}/cart`);
                const cartItems = await response.json();
                const container = document.getElementById('cart-container');
                
                if (cartItems.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-shopping-basket fa-4x text-muted mb-3"></i>
                            <h5>Giỏ hàng của bạn đang trống</h5>
                            <a href="index.html" class="btn btn-primary mt-3 rounded-pill px-4">Quay lại mua sắm</a>
                        </div>
                    `;
                    updateSummary(0);
                    document.getElementById('btn-checkout').disabled = true;
                    return;
                }

                let html = '';
                let grandTotal = 0;

                cartItems.forEach(item => {
                    const price = item.product.price;
                    const subtotal = price * item.quantity;
                    grandTotal += subtotal;

                    html += `
                        <div class="cart-item d-flex align-items-center mb-4 pb-4 border-bottom">
                            <div class="flex-shrink-0">
                                <img src="${item.product.image}" alt="${item.product.name}" class="rounded-3 shadow-sm" style="width: 100px; height: 100px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/100x100?text=Giày'">
                            </div>
                            <div class="flex-grow-1 ms-4">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <h6 class="fw-bold mb-1">${item.product.name}</h6>
                                        <p class="text-muted small mb-0">${new Intl.NumberFormat('vi-VN').format(price)}₫</p>
                                    </div>
                                    <button class="btn btn-sm btn-outline-danger border-0" onclick="removeItem(${item.id})">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                                <div class="d-flex align-items-center mt-3">
                                    <div class="input-group input-group-sm" style="width: 100px;">
                                        <button class="btn btn-outline-secondary" type="button" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                                        <input type="text" class="form-control text-center bg-white" value="${item.quantity}" readonly>
                                        <button class="btn btn-outline-secondary" type="button" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                                    </div>
                                    <span class="ms-auto fw-bold text-primary">${new Intl.NumberFormat('vi-VN').format(subtotal)}₫</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                updateSummary(grandTotal);
                document.getElementById('btn-checkout').disabled = false;

            } catch (error) {
                console.error('Error loading cart:', error);
                document.getElementById('cart-container').innerHTML = '<p class="text-danger">Không thể tải giỏ hàng. Lỗi kết nối API.</p>';
            }
        }

        async function updateQuantity(id, newQty) {
            if (newQty < 1) return;
            try {
                const response = await fetch(`${API_BASE_URL}/cart/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ quantity: newQty })
                });
                if (response.ok) {
                    loadCart();
                }
            } catch (error) {
                console.error('Error updating quantity:', error);
            }
        }

        async function removeItem(id) {
            if (!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;
            try {
                const response = await fetch(`${API_BASE_URL}/cart/${id}`, {
                    method: 'DELETE',
                    headers: { 'Accept': 'application/json' }
                });
                if (response.ok) {
                    loadCart();
                }
            } catch (error) {
                console.error('Error removing item:', error);
            }
        }

        function updateSummary(total) {
            const formatted = new Intl.NumberFormat('vi-VN').format(total) + '₫';
            document.getElementById('subtotal').innerText = formatted;
            document.getElementById('total').innerText = formatted;
        }

        async function placeOrder() {
            const btn = document.getElementById('btn-checkout');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>ĐANG XỬ LÝ...';

            try {
                const response = await fetch(`${API_BASE_URL}/checkout`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    const successModal = new bootstrap.Modal(document.getElementById('successModal'));
                    successModal.show();
                    
                    let seconds = 3;
                    const interval = setInterval(() => {
                        seconds--;
                        document.getElementById('countdown').innerText = seconds;
                        if (seconds <= 0) {
                            clearInterval(interval);
                            window.location.href = 'index.html';
                        }
                    }, 1000);
                } else {
                    alert('Có lỗi xảy ra khi đặt hàng. Vui lòng thử lại.');
                    btn.disabled = false;
                    btn.innerText = 'ĐẶT HÀNG NGAY';
                }
            } catch (error) {
                console.error('Error during checkout:', error);
                alert('Lỗi kết nối server.');
                btn.disabled = false;
                btn.innerText = 'ĐẶT HÀNG NGAY';
            }
        }
    </script>
</body>
</html>
